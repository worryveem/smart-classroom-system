spring:
  application:
    name: smartclass-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartclass_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+07:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  sql:
    init:
      mode: never
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
app:
  nodered:
    base-url: ${NODERED_BASE_URL:http://localhost:1880}
    state-path: ${NODERED_STATE_PATH:/smarthome/api/state}
    command-path: ${NODERED_COMMAND_PATH:/smarthome/api/cmd}
    connect-timeout: ${NODERED_CONNECT_TIMEOUT:3000}
    read-timeout: ${NODERED_READ_TIMEOUT:15000}
    actuator-device-id: ${NODERED_ACTUATOR_DEVICE_ID:node2_actuator}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:7200000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    teacher-password: ${SEED_TEACHER_PASSWORD:}
    student-password: ${SEED_STUDENT_PASSWORD:}

# Avoid framework request/validation debug logs exposing credentials or bearer headers.
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
